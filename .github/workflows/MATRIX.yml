name: Runner Stress Test

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Number of parallel jobs
        required: true
        default: "100"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.gen.outputs.jobs }}

    steps:
      - id: gen
        run: |
          COUNT=${{ inputs.jobs }}
          echo "jobs=$(jq -cn --argjson n "$COUNT" '[range(1; $n+1)]')" >> "$GITHUB_OUTPUT"

  stress:
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.matrix.outputs.jobs) }}

    uses: ./.github/workflows/DUMMY.yml
    secrets: inherit
